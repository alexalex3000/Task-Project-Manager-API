services:
  postgres:
    image: postgres:latest
    container_name: postgres_task_api
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '2999:5432'
    volumes:
      - pgdata:/var/lib/postgresql/

volumes:
  pgdata:
